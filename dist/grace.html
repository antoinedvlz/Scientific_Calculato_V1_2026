/* ============================================================
   Design tokens — Grace.
   Palette inspirée NumWorks : jaune signature, blancs cassés,
   contrastes francs. Bascule clair/sombre via [data-theme].
   ============================================================ */

:root {
  /* Rayons : volontairement petits, papier/calculatrice. */
  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 10px;

  /* Espacement : grille de 4px. */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;

  /* Typographies — empilées sans dépendance externe. */
  --font-sans: "Inter", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-serif: "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --font-num:  "Iowan Old Style", "Charter", Georgia, serif; /* nombres : un peu de chair */

  --t-fast: 90ms cubic-bezier(.2,.7,.3,1);
  --t-mid:  180ms cubic-bezier(.2,.7,.3,1);

  /* Couleurs absolues partagées. */
  --c-yellow: #fcc92a;
  --c-yellow-deep: #e8b400;
  --c-red:    #d4452b;
  --c-blue:   #2e6bd4;
  --c-green:  #2d8a4a;
  --c-purple: #7a4eb0;
}

/* ============== Thème clair ============== */
[data-theme="light"] {
  --bg:         #f3efe7;   /* papier cassé */
  --bg-2:       #faf6ee;   /* surface élevée */
  --bg-3:       #ffffff;   /* champs */
  --bg-sunk:    #ece6da;   /* enfoncé (sidebar) */
  --ink:        #1c1a17;   /* texte principal */
  --ink-2:      #4a4742;
  --ink-3:      #8a857e;
  --ink-4:      #b6b1a8;
  --line:       #d8d2c6;
  --line-2:     #c4bdae;
  --accent:     var(--c-yellow);
  --accent-deep:var(--c-yellow-deep);
  --on-accent:  #1c1a17;
  --good:       var(--c-green);
  --bad:        var(--c-red);
  --info:       var(--c-blue);
  --mark:       #fff3b0;   /* surlignage */
  --grid:       rgba(0,0,0,.05);
}

/* ============== Thème sombre ============== */
[data-theme="dark"] {
  --bg:         #16161a;
  --bg-2:       #1d1d22;
  --bg-3:       #25252c;
  --bg-sunk:    #111114;
  --ink:        #ece9e3;
  --ink-2:      #b9b4ab;
  --ink-3:      #7d7a73;
  --ink-4:      #4e4b46;
  --line:       #2e2e36;
  --line-2:     #3a3a44;
  --accent:     var(--c-yellow);
  --accent-deep:var(--c-yellow-deep);
  --on-accent:  #1c1a17;
  --good:       #59c576;
  --bad:        #ff6b58;
  --info:       #6fa4ff;
  --mark:       #5a4a14;
  --grid:       rgba(255,255,255,.04);
}

</style>
  <style>
/* ============================================================
   base.css — Layout général + composants partagés.
   Note : chaque app peut ajouter ses propres règles préfixées
   (.calculs- / .vkb- / .periodique- / .units- / etc.).
   ============================================================ */

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  overflow: hidden;
  /* Texture papier subtile en clair, plate en sombre. */
  background-image:
    radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
button, input, select, textarea { font: inherit; color: inherit; }
kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 6px;
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: var(--r-sm);
  color: var(--ink-2);
}
hr { border: 0; border-top: 1px solid var(--line); margin: var(--s-3) 0; }
::selection { background: var(--mark); color: var(--ink); }

/* ============== Grille principale ============== */
#app {
  display: grid;
  grid-template-columns: 232px 1fr auto;
  height: 100vh;
}

/* ============== Sidebar gauche ============== */
#sidebar {
  background: var(--bg-sunk);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: var(--s-3) var(--s-2) var(--s-2);
}
.brand {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: var(--s-1) var(--s-2) var(--s-3);
}
.brand-mark {
  width: 32px; height: 32px;
  display: inline-flex;
  align-items: center; justify-content: center;
  background: var(--accent);
  color: var(--on-accent);
  border-radius: var(--r-sm);
  font-family: var(--font-num);
  font-weight: 700;
  font-style: italic;
  font-size: 22px;
  line-height: 1;
  box-shadow: inset 0 -2px 0 var(--accent-deep);
}
.brand-name {
  font-weight: 700;
  letter-spacing: -.01em;
  font-size: 15px;
}
.brand-tag {
  margin-left: auto;
  font-size: 10px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: .06em;
}

#app-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: var(--s-1) 0;
}
.app-link {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  align-items: center;
  gap: var(--s-2);
  padding: 6px var(--s-2);
  border: 0;
  background: transparent;
  border-radius: var(--r-sm);
  cursor: pointer;
  text-align: left;
  color: var(--ink-2);
  font-size: 13px;
  transition: background var(--t-fast), color var(--t-fast);
}
.app-link:hover { background: var(--bg-3); color: var(--ink); }
.app-link.active {
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
  box-shadow: inset 0 -2px 0 var(--accent-deep);
}
.app-link.disabled {
  color: var(--ink-4);
  cursor: not-allowed;
}
.app-link.disabled:hover { background: transparent; color: var(--ink-4); }
.app-link .icon {
  font-family: var(--font-num);
  font-size: 15px;
  text-align: center;
  opacity: .9;
}
.app-link.active .icon { opacity: 1; }
.app-link .shortcut {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  letter-spacing: .04em;
}
.app-link.active .shortcut { color: var(--on-accent); opacity: .7; }

.sidebar-footer {
  display: flex;
  gap: var(--s-1);
  padding-top: var(--s-2);
  border-top: 1px solid var(--line);
  margin-top: var(--s-2);
}
.icon-btn {
  flex: 1;
  height: 30px;
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  cursor: pointer;
  color: var(--ink-2);
  font-size: 14px;
  transition: all var(--t-fast);
}
.icon-btn:hover { background: var(--bg); color: var(--ink); border-color: var(--line-2); }
.icon-btn.active {
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent-deep);
  box-shadow: inset 0 -2px 0 var(--accent-deep);
}

/* ============== Zone principale ============== */
#main {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}

/* En-tête commun à toutes les apps. */
.app-header {
  display: flex;
  align-items: baseline;
  gap: var(--s-3);
  padding: var(--s-3) var(--s-5) var(--s-2);
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
}
.app-title {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -.01em;
  line-height: 1;
}
.app-subtitle {
  color: var(--ink-3);
  font-size: 12px;
  letter-spacing: .02em;
}
.app-tools {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--s-2);
}

/* Segments style "calculator pill". */
.seg {
  display: inline-flex;
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  overflow: hidden;
  height: 28px;
}
.seg > button {
  padding: 0 var(--s-3);
  background: transparent;
  border: 0;
  border-right: 1px solid var(--line);
  cursor: pointer;
  font-size: 12px;
  color: var(--ink-2);
  letter-spacing: .04em;
}
.seg > button:last-child { border-right: 0; }
.seg > button:hover { background: var(--bg); color: var(--ink); }
.seg > button.active {
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
}

/* Boutons */
.btn {
  height: 28px;
  padding: 0 var(--s-3);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  cursor: pointer;
  color: var(--ink);
  font-size: 12px;
  transition: all var(--t-fast);
}
.btn:hover { background: var(--bg); border-color: var(--line-2); }
.btn.primary {
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent-deep);
  box-shadow: inset 0 -2px 0 var(--accent-deep);
  font-weight: 600;
}
.btn.primary:hover { background: var(--accent-deep); }
.btn.danger:hover { color: var(--bad); border-color: var(--bad); }

/* Champs */
.field {
  height: 28px;
  padding: 0 var(--s-2);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  outline: none;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--ink);
  transition: border-color var(--t-fast);
}
.field:focus { border-color: var(--accent); }

/* ============== Coming soon (placeholder) ============== */
.coming-soon {
  margin: auto;
  text-align: center;
  color: var(--ink-3);
  padding: var(--s-6);
  max-width: 420px;
}
.coming-soon h2 {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 36px;
  margin: 0 0 var(--s-3);
  color: var(--ink-2);
}
.coming-soon p { margin: 0 0 var(--s-3); }

/* ============== App Calculs ============== */
.calculs-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.history {
  flex: 1;
  overflow-y: auto;
  padding: var(--s-5);
  display: flex;
  flex-direction: column-reverse;
  gap: var(--s-3);
}
.history-empty {
  margin: auto;
  text-align: center;
  color: var(--ink-3);
  padding: var(--s-4);
}
.history-empty .tips {
  margin-top: var(--s-3);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-4);
  display: grid;
  gap: 4px;
  text-align: left;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: var(--s-3);
  max-width: 380px;
  margin-inline: auto;
}
.hist-entry {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 14px;
  background: var(--bg-2);
  border-left: 3px solid var(--line);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
}
.hist-entry:hover { border-left-color: var(--accent); }
.hist-input, .hist-output {
  cursor: pointer;
  padding: 2px 4px;
  border-radius: var(--r-xs);
  overflow-x: auto;
  font-size: 15px;
}
.hist-input { color: var(--ink-3); }
.hist-input:hover { background: var(--mark); color: var(--ink); }
.hist-output {
  align-self: flex-end;
  font-size: 17px;
  font-family: var(--font-num);
}
.hist-output:hover { background: var(--mark); }
.hist-error {
  color: var(--bad);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 2px 4px;
}

.input-area {
  border-top: 1px solid var(--line);
  background: var(--bg-2);
  padding: var(--s-3) var(--s-4);
}
.input-preview {
  min-height: 42px;
  padding: var(--s-2) var(--s-3);
  margin-bottom: var(--s-2);
  background: var(--bg);
  border: 1px dashed var(--line);
  border-radius: var(--r-sm);
  font-size: 20px;
  display: flex;
  align-items: center;
  overflow-x: auto;
  color: var(--ink);
}
.input-preview.empty {
  color: var(--ink-4);
  font-size: 12px;
  font-style: italic;
  border-style: dashed;
}
.input-preview.error {
  color: var(--bad);
  font-family: var(--font-mono);
  font-size: 13px;
}
.input-row {
  display: flex;
  gap: var(--s-2);
}
.input-line {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 16px;
  padding: 10px 12px;
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  outline: none;
}
.input-line:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--mark); }
.input-row .btn.primary {
  height: auto;
  min-width: 90px;
  font-size: 14px;
}

.vars-panel {
  padding: 6px var(--s-5);
  font-size: 12px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  border-top: 1px dashed var(--line);
  background: var(--bg-2);
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
  max-height: 70px;
  overflow-y: auto;
}
.var-chip {
  padding: 2px 8px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 99px;
  cursor: pointer;
}
.var-chip:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent-deep); }

/* ============== Clavier virtuel ============== */
#vkb {
  width: 320px;
  background: var(--bg-sunk);
  border-left: 1px solid var(--line);
  padding: var(--s-3);
  overflow-y: auto;
}
.vkb-section { margin-bottom: var(--s-4); }
.vkb-section h4 {
  margin: 0 0 var(--s-2);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--ink-3);
}
.vkb-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.vkb-key {
  height: 36px;
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 13px;
  transition: all var(--t-fast);
  box-shadow: inset 0 -2px 0 var(--line);
  color: var(--ink);
}
.vkb-key:hover {
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent-deep);
  box-shadow: inset 0 -2px 0 var(--accent-deep);
}
.vkb-key:active { transform: translateY(1px); box-shadow: none; }
.vkb-key.wide { grid-column: span 2; }

/* ============================================================
   Apps spécifiques
   ============================================================ */

/* ----- App Tableau périodique ----- */
.periodique {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}
.periodique-toolbar {
  padding: var(--s-3) var(--s-5);
  display: flex;
  gap: var(--s-3);
  align-items: center;
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
  flex-wrap: wrap;
}
.periodique-toolbar .legend {
  display: flex;
  gap: var(--s-3);
  margin-left: auto;
  font-size: 11px;
  color: var(--ink-3);
  flex-wrap: wrap;
}
.legend-dot {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.legend-dot::before {
  content: "";
  width: 10px; height: 10px;
  border-radius: 2px;
  background: currentColor;
}
.periodique-grid {
  flex: 1;
  overflow: auto;
  padding: var(--s-3) var(--s-5) var(--s-4);
  display: grid;
  grid-template-columns: repeat(18, minmax(46px, 1fr));
  gap: 3px;
  align-content: start;
}
.periodique-grid.compact { grid-template-columns: repeat(18, minmax(34px, 1fr)); }
.el {
  position: relative;
  aspect-ratio: 1 / 1;
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--r-xs);
  cursor: pointer;
  padding: 3px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-family: var(--font-mono);
  transition: transform var(--t-fast), box-shadow var(--t-fast);
}
.el:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
  z-index: 2;
}
.el.dim { opacity: .15; pointer-events: none; }
.el .z { font-size: 9px; color: var(--ink-3); text-align: left; line-height: 1; }
.el .sym {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: 18px;
  text-align: center;
  line-height: 1;
  color: var(--ink);
}
.el .mass { font-size: 8px; color: var(--ink-3); text-align: center; }

/* Catégories : couleurs de fond pastel. */
.el[data-cat="alcalin"]        { background: #fde2e2; }
.el[data-cat="alcalino-terreux"]{ background: #fde7c8; }
.el[data-cat="transition"]     { background: #f5e3d0; }
.el[data-cat="post-transition"]{ background: #e5e8e0; }
.el[data-cat="metalloide"]     { background: #d8e6cd; }
.el[data-cat="non-metal"]      { background: #d0e8f0; }
.el[data-cat="halogene"]       { background: #d6d4ec; }
.el[data-cat="gaz-noble"]      { background: #ecd6e6; }
.el[data-cat="lanthanide"]     { background: #fad7e1; }
.el[data-cat="actinide"]       { background: #f9d3c1; }
.el[data-cat="inconnu"]        { background: #e0ddd5; }
[data-theme="dark"] .el { color: var(--ink); }
[data-theme="dark"] .el[data-cat="alcalin"]         { background: #5a2828; }
[data-theme="dark"] .el[data-cat="alcalino-terreux"]{ background: #5a3a1c; }
[data-theme="dark"] .el[data-cat="transition"]      { background: #4a3a26; }
[data-theme="dark"] .el[data-cat="post-transition"] { background: #353a2c; }
[data-theme="dark"] .el[data-cat="metalloide"]      { background: #2c4a30; }
[data-theme="dark"] .el[data-cat="non-metal"]       { background: #1e3e4a; }
[data-theme="dark"] .el[data-cat="halogene"]        { background: #353258; }
[data-theme="dark"] .el[data-cat="gaz-noble"]       { background: #4a2e44; }
[data-theme="dark"] .el[data-cat="lanthanide"]      { background: #4a2638; }
[data-theme="dark"] .el[data-cat="actinide"]        { background: #4a2e1c; }

/* Légende : on lui assigne les mêmes couleurs via une classe sœur. */
.legend-dot.alcalin         { color: #d4452b; }
.legend-dot.alcalino-terreux{ color: #c47514; }
.legend-dot.transition      { color: #9c6a3a; }
.legend-dot.post-transition { color: #6b7e4a; }
.legend-dot.metalloide      { color: #3e7a4a; }
.legend-dot.non-metal       { color: #2e6bd4; }
.legend-dot.halogene        { color: #5a4eb0; }
.legend-dot.gaz-noble       { color: #a04a90; }
.legend-dot.lanthanide      { color: #c44676; }
.legend-dot.actinide        { color: #c45a30; }

/* Détail élément (panneau de droite) */
.el-detail {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 400px;
  background: var(--bg-2);
  border-left: 1px solid var(--line);
  padding: var(--s-4) var(--s-5);
  overflow-y: auto;
  box-shadow: -4px 0 16px rgba(0,0,0,.08);
  z-index: 10;
  display: none;
}
.el-detail.open { display: block; }
.el-detail .close {
  position: absolute; top: var(--s-3); right: var(--s-3);
  background: var(--bg-3); border: 1px solid var(--line);
  border-radius: var(--r-sm);
  width: 28px; height: 28px;
  cursor: pointer;
}
.el-detail .symbig {
  font-family: var(--font-num);
  font-size: 92px;
  font-weight: 700;
  line-height: 1;
  color: var(--ink);
  margin: 0;
}
.el-detail .nm {
  font-family: var(--font-serif);

  <!-- IIFE qui attachent au namespace global window.GR -->
  <script>
/**
 * state.js — Store global + persistance localStorage.
 *
 * Pattern : "store" minimaliste. On garde un objet d'état mutable, on déclenche
 * save() après chaque changement, et les composants peuvent s'abonner via
 * subscribe() pour réagir aux changements.
 *
 * Pourquoi pas Redux/etc. : surdimensionné pour un projet single-file. Cette
 * approche tient en 60 lignes et fait le travail.
 */
(function (GR) {
  'use strict';

  const STORAGE_KEY = 'grace.state.v1';

  // État par défaut. Toute nouvelle clé doit être ajoutée ici.
  const DEFAULT = {
    theme: 'light',          // 'light' | 'dark'
    currentApp: 'calculs',   // id de l'app affichée
    angleMode: 'rad',        // 'rad' | 'deg' (mode trigonométrique)
    history: [],             // [{ expr, latex, result, resultLatex, isError, ts }]
    vars: {},                // variables utilisateur sérialisées { A: 5, B: ... }
    vkbOpen: false,          // clavier virtuel visible ?
  };

  // Charge le state depuis localStorage, fusionne avec DEFAULT (au cas où on
  // ajoute des clés dans une future version sans casser les sauvegardes).
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { ...DEFAULT };
      const parsed = JSON.parse(raw);
      return { ...DEFAULT, ...parsed };
    } catch (e) {
      console.warn('Impossible de charger le state, reset.', e);
      return { ...DEFAULT };
    }
  }

  const state = load();
  const subscribers = new Set();

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      // Quota dépassé : on tronque l'historique au pire des cas.
      console.warn('Sauvegarde échouée, tentative de nettoyage.', e);
      state.history = state.history.slice(-50);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    }
  }

  // Met à jour l'état (patch superficiel) et notifie les abonnés.
  function set(patch) {
    Object.assign(state, patch);
    save();
    subscribers.forEach(fn => fn(state));
  }

  function subscribe(fn) {
    subscribers.add(fn);
    return () => subscribers.delete(fn);
  }

  // Helpers ciblés pour l'historique (évite de dupliquer Array.prototype.push partout).
  function pushHistory(entry) {
    state.history.push({ ts: Date.now(), ...entry });
    // Garde-fou : limiter à 500 entrées max pour éviter ballonnement localStorage.
    if (state.history.length > 500) state.history.shift();
    save();
    subscribers.forEach(fn => fn(state));
  }

  function clearHistory() {
    state.history = [];
    save();
    subscribers.forEach(fn => fn(state));
  }

  GR.state = {
    get: () => state,
    set,
    subscribe,
    pushHistory,
    clearHistory,
    save,
  };

})(window.GR = window.GR || {});

</script>
  <script>
/**
 * latex.js — Petit wrapper autour de KaTeX.
 *
 * Deux usages :
 *   - render(target, tex)           → rend le LaTeX final dans un élément.
 *   - exprToLatex(expr) → string|null → essaie de convertir une expression
 *     math.js en LaTeX (sert à l'aperçu live au-dessus de la zone de saisie).
 */
(function (GR) {
  'use strict';

  function render(target, tex, opts) {
    if (!window.katex) {
      target.textContent = tex;
      return;
    }
    try {
      window.katex.render(tex, target, {
        throwOnError: false,
        displayMode: false,
        output: 'html',
        ...opts,
      });
    } catch (e) {
      // Filet de sécurité : on n'a pas envie qu'une erreur LaTeX casse la page.
      target.textContent = tex;
    }
  }

  // Convertit une expression utilisateur en LaTeX via math.js.
  // Retourne null si la saisie n'est pas (encore) parsable — l'UI affichera
  // alors la chaîne brute en mode "code".
  function exprToLatex(expr) {
    if (!window.math) return null;
    if (!expr || !expr.trim()) return null;
    try {
      const node = window.math.parse(expr);
      // toTex({ parenthesis: 'keep' }) garde les parenthèses telles qu'écrites.
      return node.toTex({ parenthesis: 'keep', implicit: 'show' });
    } catch (e) {
      return null;
    }
  }

  // Convertit un résultat (number, Complex, BigNumber, Unit…) en LaTeX.
  function valueToLatex(value) {
    if (!window.math) return String(value);
    try {
      // math.format gère proprement la précision et les types spéciaux.
      const formatted = window.math.format(value, { precision: 12 });
      // On reparse le résultat formaté pour obtenir un LaTeX propre.
      return window.math.parse(formatted).toTex({ parenthesis: 'keep' });
    } catch {
      return String(value);
    }
  }

  GR.latex = { render, exprToLatex, valueToLatex };

})(window.GR = window.GR || {});

</script>

 *   - Mode angulaire (rad/deg) via override des fonctions trig dans le scope.
 *   - Alias francophones (pgcd, ppcm, frac).
 *   - Injection des constantes physiques (data/constants.js) dans le scope.
 *   - Évaluation d'expressions avec unités natives (math.js gère « 5 m + 3 cm »).
 */
(function (GR) {
  'use strict';

  let parser = null;
  let angleMode = 'rad';
  let nativeTrig = null;
  // On garde la liste des id de constantes pour pouvoir les exclure du
  // panneau "variables utilisateur" (qui ne montre que A..Z et ans).
  const constantIds = new Set();

  function ensureReady() {
    if (parser) return;
    if (!window.math) throw new Error('math.js non chargé');
    parser = window.math.parser();
    nativeTrig = {
      sin: window.math.sin, cos: window.math.cos, tan: window.math.tan,
      asin: window.math.asin, acos: window.math.acos, atan: window.math.atan,
      atan2: window.math.atan2,
    };
    installAliases();
    installConstants();
    applyAngleMode();
    restoreVarsFromState();
  }

  function installAliases() {
    parser.set('pgcd', (...a) => window.math.gcd(...a));
    parser.set('ppcm', (...a) => window.math.lcm(...a));
    parser.set('frac', x => window.math.subtract(x, window.math.floor(x)));
  }

  // Charge toutes les constantes (data/constants.js) dans le scope parser.
  // On évalue chaque chaîne « value » avec math.evaluate pour obtenir un
  // Unit, un BigNumber ou un nombre — selon ce que contient la chaîne.
  function installConstants() {
    if (!GR.data || !GR.data.constants) return;
    GR.data.constants.list.forEach(c => {
      // pi et e sont déjà natifs dans math.js — on les saute pour ne pas
      // shadow leur définition.
      if (c.id === 'pi_const' || c.id === 'e_const') return;
      try {
        const v = window.math.evaluate(c.value);
        parser.set(c.id, v);
        constantIds.add(c.id);
      } catch (e) {
        console.warn(`Constante ${c.id} non injectée :`, e.message);
      }
    });
  }

  function applyAngleMode() {
    const deg2rad = window.math.unit(1, 'deg').toNumber('rad');
    const rad2deg = 1 / deg2rad;
    if (angleMode === 'deg') {
      parser.set('sin',  x => nativeTrig.sin(x * deg2rad));
      parser.set('cos',  x => nativeTrig.cos(x * deg2rad));
      parser.set('tan',  x => nativeTrig.tan(x * deg2rad));
      parser.set('asin', x => nativeTrig.asin(x) * rad2deg);
      parser.set('acos', x => nativeTrig.acos(x) * rad2deg);
      parser.set('atan', x => nativeTrig.atan(x) * rad2deg);
      parser.set('atan2',(y,x)=> nativeTrig.atan2(y,x) * rad2deg);
    } else {
      parser.set('sin',  nativeTrig.sin);
      parser.set('cos',  nativeTrig.cos);
      parser.set('tan',  nativeTrig.tan);
      parser.set('asin', nativeTrig.asin);
      parser.set('acos', nativeTrig.acos);
      parser.set('atan', nativeTrig.atan);
      parser.set('atan2', nativeTrig.atan2);
    }
  }

  function setAngleMode(mode) {
    angleMode = (mode === 'deg') ? 'deg' : 'rad';
    if (parser) applyAngleMode();
  }
  function getAngleMode() { return angleMode; }

  // Évalue. Toujours résilient (jamais de throw vers l'appelant).
  function evaluate(expr) {
    ensureReady();
    const trimmed = (expr || '').trim();
    if (!trimmed) return { ok:false, error:'Expression vide' };

    let tex;
    try {
      tex = window.math.parse(trimmed).toTex({ parenthesis:'keep', implicit:'show' });
    } catch (e) {
      return { ok:false, error:e.message, expr:trimmed };
    }

    let result;
    try { result = parser.evaluate(trimmed); }
    catch (e) { return { ok:false, error:e.message, expr:trimmed, tex }; }

    if (result && result.entries) result = result.entries[result.entries.length - 1];
    if (typeof result === 'undefined') {
      return { ok:true, expr:trimmed, tex, result:null, resultLatex:'' };
    }
    parser.set('ans', result);

    const resultLatex = GR.latex.valueToLatex(result);
    syncVarsToState();
    return { ok:true, expr:trimmed, tex, result, resultLatex };
  }

  // ---------- Variables utilisateur ----------
  function isUserVarName(name) {
    if (constantIds.has(name)) return false;
    return /^[A-Z]$/.test(name) || name === 'ans';
  }

  function syncVarsToState() {
    if (!parser) return;
    const all = parser.getAll();
    const out = {};
    for (const k of Object.keys(all)) {
      if (!isUserVarName(k)) continue;
      try { out[k] = window.math.format(all[k], { precision: 14 }); } catch {}
    }
    GR.state.set({ vars: out });
  }

  function restoreVarsFromState() {
    const saved = GR.state.get().vars || {};
    for (const [name, value] of Object.entries(saved)) {
      try { parser.set(name, window.math.evaluate(value)); }
      catch (e) { console.warn(`Variable ${name} non restaurable :`, e.message); }
    }
  }

  function listVars() {
    if (!parser) return {};
    const all = parser.getAll();
    const out = {};
    for (const k of Object.keys(all)) if (isUserVarName(k)) out[k] = all[k];
    return out;
  }

  function clearVars() {
    if (!parser) return;
    for (const k of Object.keys(parser.getAll())) {
      if (isUserVarName(k)) parser.remove(k);
    }
    GR.state.set({ vars: {} });
  }

  // Helper : convertir une valeur (chaîne avec unité) vers une autre unité.
  // Renvoie { ok, valueLatex, valueText } ou { ok:false, error }.
  function convertUnit(value, fromUnit, toUnit) {
    ensureReady();
    try {
      const v = window.math.evaluate(`(${value} ${fromUnit}) to ${toUnit}`);
      return { ok:true, value:v, text:window.math.format(v, { precision:10 }) };
    } catch (e) {
      return { ok:false, error:e.message };
    }
  }

  GR.engine = {
    evaluate,
    setAngleMode, getAngleMode,
    listVars, clearVars,
    convertUnit,
    constantIds,   // exposé pour Réglages / debug
  };

})(window.GR = window.GR || {});

</script>
  <script>
/**
 * keyboard.js — Raccourcis clavier globaux.
 *
 * On centralise les raccourcis ici pour pouvoir les afficher dans la sidebar
 * et éviter les conflits entre apps. Une app peut ajouter ses propres
 * raccourcis locaux dans son mount(), mais le routeur d'apps reste maître.
 */
(function (GR) {
  'use strict';

  // Liste des raccourcis globaux. Chaque entrée :
  //   { combo: 'Ctrl+1', label: 'Calculs', handler: () => ... }
  const handlers = [];

  function register(combo, label, handler) {
    handlers.push({ combo, label, handler });
  }

  // Convertit un évènement clavier en chaîne canonique : "Ctrl+Shift+K"
  function eventToCombo(e) {
    const parts = [];
    if (e.ctrlKey || e.metaKey) parts.push('Ctrl'); // on traite Cmd ≡ Ctrl
    if (e.shiftKey) parts.push('Shift');
    if (e.altKey) parts.push('Alt');
    // Touches lettres/chiffres : on prend la valeur "key" en majuscule.
    let k = e.key;
    if (k === 'Escape') k = 'Esc';
    if (k.length === 1) k = k.toUpperCase();
    parts.push(k);
    return parts.join('+');
  }

  function init() {
    window.addEventListener('keydown', (e) => {
      const combo = eventToCombo(e);
      // On ignore les raccourcis simples si l'utilisateur tape dans un input.
      // Mais on autorise les Ctrl+xxx même dans un input (ex : Ctrl+1).
      const inField = e.target.matches?.('input, textarea, [contenteditable="true"]');
      const isModified = e.ctrlKey || e.metaKey || e.altKey;

      for (const h of handlers) {
        if (h.combo === combo) {
          if (inField && !isModified && h.combo !== 'Esc') continue;
          e.preventDefault();
          h.handler();
          return;
        }
      }
    });
  }

  function list() { return handlers.slice(); }

  GR.keyboard = { register, init, list };

})(window.GR = window.GR || {});

</script>

  <script>
/**
 * apps/calculs.js — Application "Calculs".
 *
 * Supporte directement les unités (math.js le fait nativement) et les
 * constantes physiques (injectées via data/constants.js).
 *
 * Exemples utilisables :
 *   2*sin(pi/4) + sqrt(2)
 *   (1/2) * 2 kg * (3 m/s)^2   →  9 J  (analyse dimensionnelle gratuite)
 *   c * 1 ns to mm             →  299.79… mm
 *   h * 5e14 Hz to eV          →  énergie d'un photon visible
 *   N_A * k_B                  →  R (constante des gaz)
 *   3 m + 25 cm                →  3.25 m
 *   A = 5,  A^2 + 3            →  28
 */
(function (GR) {
  'use strict';

  const VKB_SECTIONS = [
    { title:'Nombres & opérateurs', keys:[
      ['7','7'],['8','8'],['9','9'],['÷','/'],
      ['4','4'],['5','5'],['6','6'],['×','*'],
      ['1','1'],['2','2'],['3','3'],['−','-'],
      ['0','0'],['.','.'],['(','('],[')',')'],
      ['+','+'],['^','^'],['=','='],['ans','ans'],
    ]},
    { title:'Fonctions', keys:[
      ['sin','sin('],['cos','cos('],['tan','tan('],['π','pi'],
      ['asin','asin('],['acos','acos('],['atan','atan('],['e','e'],
      ['ln','ln('],['log','log10('],['exp','exp('],['√','sqrt('],
      ['x²','^2'],['xⁿ','^'],['1/x','1/'],['|x|','abs('],
      ['n!','!'],['mod','mod'],['⌊⌋','floor('],['⌈⌉','ceil('],
    ]},
    { title:'Unités usuelles', keys:[
      ['m','m'],['cm','cm'],['mm','mm'],['km','km'],
      ['kg','kg'],['g','g'],['s','s'],['Hz','Hz'],
      ['N','N'],['J','J'],['W','W'],['Pa','Pa'],
      ['V','V'],['A','A'],['Ω','ohm'],['°C','degC'],
      ['to','to'],['°','deg'],['rad','rad'],['eV','eV'],
    ]},
    { title:'Constantes', keys:[
      ['c','c'],['h','h'],['ℏ','hbar'],['G','G_const'],
      ['e⁻','e_charge'],['k_B','k_B'],['N_A','N_A'],['R','R_gas'],
      ['ε₀','epsilon_0'],['μ₀','mu_0'],['mₑ','m_e'],['m_p','m_p'],
      ['g₀','g_0'],['σ','sigma_SB'],['α','alpha'],['φ','phi'],
    ]},
    { title:'Variables', keys:[
      ['A','A'],['B','B'],['C','C'],['D','D'],
      ['X','X'],['Y','Y'],['Z','Z'],['ans','ans'],
    ]},
  ];

  let elInput, elPreview, elHistory, elVarsPanel, elAngleToggle;
  let unsubscribe = null;
  let histCursor = -1;

  function mount(container) {
    container.innerHTML = '';
    const header = document.createElement('div');
    header.className = 'app-header';
    header.innerHTML = `
      <span class="app-title">Calculs</span>
      <span class="app-subtitle">unités &amp; constantes prises en charge</span>
      <div class="app-tools">
        <div class="seg" aria-label="Mode angulaire">
          <button data-mode="rad">RAD</button>
          <button data-mode="deg">DEG</button>
        </div>
        <button class="btn danger" id="clear-history" title="Effacer l'historique">Effacer</button>
      </div>
    `;
    container.appendChild(header);
    elAngleToggle = header.querySelector('.seg');
    elAngleToggle.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-mode]'); if (!b) return;
      GR.engine.setAngleMode(b.dataset.mode);
      GR.state.set({ angleMode: b.dataset.mode });
      updateAngleToggle();
    });
    header.querySelector('#clear-history').addEventListener('click', () => {
      if (confirm('Effacer tout l\'historique ?')) GR.state.clearHistory();
    });

    const body = document.createElement('div');
    body.className = 'calculs-body';
    body.innerHTML = `
      <div class="history" id="history"></div>
      <div class="vars-panel" id="vars-panel"></div>
      <div class="input-area">
        <div class="input-preview empty" id="input-preview">Tapez une expression…</div>
        <div class="input-row">
          <input type="text" class="input-line" id="input-line"
                 autocomplete="off" autocorrect="off" autocapitalize="off"
                 spellcheck="false" placeholder="ex : (1/2) * 2 kg * (3 m/s)^2">
          <button class="btn primary" id="btn-eval">Entrée ⏎</button>
        </div>
      </div>
    `;
    container.appendChild(body);

    elInput     = body.querySelector('#input-line');
    elPreview   = body.querySelector('#input-preview');
    elHistory   = body.querySelector('#history');
    elVarsPanel = body.querySelector('#vars-panel');

    elInput.addEventListener('input', updatePreview);
    elInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter')     { e.preventDefault(); doEval(); }
      if (e.key === 'ArrowUp')   { e.preventDefault(); navigateHistory(-1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); navigateHistory(+1); }
    });
    body.querySelector('#btn-eval').addEventListener('click', doEval);

    unsubscribe = GR.state.subscribe(() => {
      renderHistory(); renderVars(); updateAngleToggle();
    });
    updateAngleToggle();
    renderHistory();
    renderVars();
    setTimeout(() => elInput.focus(), 0);
  }

  function unmount() { if (unsubscribe) { unsubscribe(); unsubscribe = null; } }

  function updateAngleToggle() {
    const mode = GR.engine.getAngleMode();
    elAngleToggle.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
  }

  function updatePreview() {
    const expr = elInput.value;
    if (!expr.trim()) {
      elPreview.className = 'input-preview empty';
      elPreview.textContent = 'Tapez une expression…';
      return;
    }
    const tex = GR.latex.exprToLatex(expr);
    if (tex === null) {
      elPreview.className = 'input-preview error';
      elPreview.textContent = expr;
    } else {
      elPreview.className = 'input-preview';
      GR.latex.render(elPreview, tex);
    }
  }

  function navigateHistory(direction) {
    const hist = GR.state.get().history;
    if (!hist.length) return;
    if (histCursor === -1 && direction < 0) histCursor = hist.length;

    if (histCursor === hist.length) elInput.value = '';

    updatePreview();
  }

  function doEval() {
    const expr = elInput.value;
    if (!expr.trim()) return;
    const r = GR.engine.evaluate(expr);
    if (!r.ok) {
      GR.state.pushHistory({ expr, latex:r.tex||null, isError:true, error:r.error });
    } else {
      GR.state.pushHistory({
        expr:r.expr, latex:r.tex,
        result: typeof r.result === 'object' ? null : r.result,
        resultLatex: r.resultLatex,
        isError:false,
      });
    }
    elInput.value = '';
    histCursor = -1;
    updatePreview();
  }

  function renderHistory() {
    const hist = GR.state.get().history;
    elHistory.innerHTML = '';
    if (!hist.length) {
      const empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.innerHTML = `
        <p>Tape une expression. Quelques pistes :</p>
        <div class="tips">
          <div>2*sin(pi/4) + sqrt(2)</div>
          <div>3 m + 25 cm</div>
          <div>(1/2) * 2 kg * (3 m/s)^2</div>
          <div>c * 1 ns to mm</div>
          <div>h * 5e14 Hz to eV</div>
          <div>A = 5,  A^2 + 3</div>
        </div>`;
      elHistory.appendChild(empty);
      return;
    }
    for (let i = hist.length - 1; i >= 0; i--) {
      elHistory.appendChild(renderEntry(hist[i]));
    }
  }

  function renderEntry(entry) {
    const div = document.createElement('div');
    div.className = 'hist-entry';
    const inp = document.createElement('div');
    inp.className = 'hist-input';
    inp.title = 'Cliquer pour réutiliser';
    if (entry.latex) GR.latex.render(inp, entry.latex);
    else inp.textContent = entry.expr;
    inp.addEventListener('click', () => {
      elInput.value = entry.expr; elInput.focus(); updatePreview();
    });
    div.appendChild(inp);

    if (entry.isError) {
      const err = document.createElement('div');
      err.className = 'hist-error';
      err.textContent = '⚠ ' + entry.error;
      div.appendChild(err);
    } else {
      const out = document.createElement('div');
      out.className = 'hist-output';
      out.title = 'Cliquer pour insérer';
      if (entry.resultLatex) GR.latex.render(out, '= ' + entry.resultLatex);
      else out.textContent = '= ' + (entry.result ?? '');
      out.addEventListener('click', () => {
        insertAtCursor(elInput, '(' + entry.expr + ')');
        elInput.focus(); updatePreview();
      });
      div.appendChild(out);
    }
    return div;
  }

  function renderVars() {
    const vars = GR.state.get().vars || {};
    elVarsPanel.innerHTML = '';
    const keys = Object.keys(vars).sort();
    if (!keys.length) {
      elVarsPanel.innerHTML = '<span style="opacity:.6">Aucune variable. Tape « A = 5 » pour en créer.</span>';
      return;
    }
    keys.forEach(k => {
      const chip = document.createElement('span');
      chip.className = 'var-chip';
      chip.textContent = `${k} = ${vars[k]}`;
      chip.title = `Insérer « ${k} »`;
      chip.addEventListener('click', () => {
        insertAtCursor(elInput, k); elInput.focus(); updatePreview();
      });
      elVarsPanel.appendChild(chip);
    });
  }

  function renderVKB(container) {
    container.innerHTML = '';
    VKB_SECTIONS.forEach(sec => {
      const s = document.createElement('div');
      s.className = 'vkb-section';
      const h = document.createElement('h4');
      h.textContent = sec.title;
      s.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'vkb-grid';
      sec.keys.forEach(([label, value]) => {
        const b = document.createElement('button');
        b.className = 'vkb-key';
        b.textContent = label;
        b.addEventListener('click', () => {
          if (!elInput) return;
          insertAtCursor(elInput, value);
          elInput.focus(); updatePreview();
        });
        grid.appendChild(b);
      });
      s.appendChild(grid);
      container.appendChild(s);
    });
  }

  function insertAtCursor(input, text) {
    const s = input.selectionStart ?? input.value.length;
    const e = input.selectionEnd ?? input.value.length;
    input.value = input.value.slice(0, s) + text + input.value.slice(e);
    input.setSelectionRange(s + text.length, s + text.length);
  }

  GR.apps = GR.apps || {};
  GR.apps.calculs = {
    id:'calculs', name:'Calculs', icon:'∑', available:true,
    mount, unmount, renderVKB,
  };

})(window.GR = window.GR || {});

    // on garde une étiquette discrète sur la ligne du dessous.
    const ln = document.createElement('div');
    ln.style.cssText = 'grid-row:9;grid-column:2;font-size:10px;color:var(--ink-3);text-align:right;align-self:center;padding-right:6px';
    ln.textContent = '57-71';
    elGrid.appendChild(ln);
    const ac = document.createElement('div');
    ac.style.cssText = 'grid-row:10;grid-column:2;font-size:10px;color:var(--ink-3);text-align:right;align-self:center;padding-right:6px';
    ac.textContent = '89-103';
    elGrid.appendChild(ac);
  }

  function formatMass(m) {
    if (Array.isArray(m)) return `[${m[0]}]`;
    if (typeof m !== 'number') return '';
    if (m < 100) return m.toFixed(3);
    return m.toFixed(2);
  }

  // ----------------- Détail d'un élément -----------------
  function showDetail(e) {
    const valence = computeValence(e.cfg);
    const quantum = formatQuantum(valence);
    elDetail.innerHTML = `
      <button class="close" aria-label="Fermer">✕</button>
      <div style="display:flex;align-items:flex-start;gap:18px">
        <div>
          <p class="symbig" style="color:${catColor(e.cat)}">${e.sym}</p>
          <p class="nm">${e.nm}</p>
          <p style="margin:0;color:var(--ink-3);font-size:12px">${e.nmEn || ''}</p>
        </div>
        <div style="flex:1"></div>
      </div>

      <h3>Identité</h3>
      ${row('Numéro atomique (Z)', e.z)}
      ${row('Masse atomique', Array.isArray(e.mass) ? `${e.mass[0]} u (isotope stable)` : `${e.mass} u`)}
      ${row('Catégorie', categoryLabel(e.cat))}
      ${row('Bloc', e.block + ' (' + blockLabel(e.block) + ')')}
      ${row('Période / Groupe', `${e.period} / ${e.group ?? '—'}`)}
      ${row('Découverte', e.discYr ?? 'antiquité')}

      <h3>Structure électronique</h3>
      ${row('Configuration', e.cfg)}
      ${row('Électrons de valence', valence.count ?? '—')}
      ${row('Nombres quantiques (val.)', quantum)}
      ${row('Spin (chaque e⁻)', '±½')}
      ${row('Électronégativité (Pauling)', e.en ?? '—')}
      ${row('États d\'oxydation', (e.ox && e.ox.length) ? e.ox.map(o => o > 0 ? '+'+o : o).join(', ') : '—')}

      <h3>Propriétés physiques</h3>
      ${row('Rayon atomique', e.ar ? e.ar + ' pm' : '—')}
      ${row('Rayon covalent', e.cr ? e.cr + ' pm' : '—')}
      ${row('Rayon de Van der Waals', e.vdwr ? e.vdwr + ' pm' : '—')}
      ${row('Point de fusion', e.mp ? `${e.mp} K (${(e.mp-273.15).toFixed(1)} °C)` : '—')}
      ${row('Point d\'ébullition', e.bp ? `${e.bp} K (${(e.bp-273.15).toFixed(1)} °C)` : '—')}
      ${row('Densité (STP)', e.dens ? `${e.dens} g/cm³` : '—')}
      ${row('Structure cristalline', e.xtal ?? '—')}

      <h3>Isotopes</h3>
      ${(e.iso && e.iso.length) ? e.iso.map(i =>
        `<div class="row"><span class="k">${e.sym}-${i.a}</span>` +
        `<span class="v">${i.ab !== null && i.ab !== undefined ? i.ab + ' %' : 'radioactif'}</span></div>`
      ).join('') : '<div class="row"><span class="k">—</span><span class="v">aucun listé</span></div>'}

      ${e.notes ? `<h3>Note</h3><p style="font-size:13px;color:var(--ink-2);margin:0">${e.notes}</p>` : ''}
    `;
    elDetail.classList.add('open');
    elDetail.querySelector('.close').addEventListener('click', hideDetail);
  }

  function hideDetail() { elDetail.classList.remove('open'); }

  function row(k, v) {
    return `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  }

  function categoryLabel(cat) {
    const c = GR.data.periodic.categories.find(([id]) => id === cat);
    return c ? c[1] : cat;
  }
  function blockLabel(b) {
    return { s:'alcalins/alc-terreux', p:'principaux', d:'transition', f:'lanth/actin' }[b] || '';
  }
  function catColor(cat) {
    // Repris des couleurs des dots dans theme.css.
    return ({
      'alcalin':'#d4452b','alcalino-terreux':'#c47514','transition':'#9c6a3a',
      'post-transition':'#6b7e4a','metalloide':'#3e7a4a','non-metal':'#2e6bd4',
      'halogene':'#5a4eb0','gaz-noble':'#a04a90','lanthanide':'#c44676',
      'actinide':'#c45a30','inconnu':'#777'
    })[cat] || 'var(--ink)';
  }

  // Calcule, à partir de la configuration condensée (« [Ar] 3d⁵ 4s¹ »),
  // les électrons de valence et leur(s) nombre(s) quantique(s).
  // Logique simple : on regarde la dernière coquille (max n) et on
  // compte les électrons dont le n est ce maximum.
  function computeValence(cfg) {
    if (!cfg) return { count: null, shells: [] };
    // Tokens type "4s¹", "3d¹⁰", "2p⁶", "4f¹⁴"…
    const tokens = cfg.replace(/\[[^\]]+\]\s*/, '').trim().split(/\s+/);
    const sup = { '⁰':0,'¹':1,'²':2,'³':3,'⁴':4,'⁵':5,'⁶':6,'⁷':7,'⁸':8,'⁹':9 };
    const parsed = tokens.map(t => {
      const m = t.match(/^(\d+)([spdf])([⁰-⁹¹]+)$/);
      if (!m) return null;
      const n = parseInt(m[1], 10);
      const l = m[2];
      const num = [...m[3]].reduce((a,c) => a*10 + (sup[c] ?? 0), 0);
      return { n, l, num };
    }).filter(Boolean);
    if (!parsed.length) return { count: null, shells: [] };
    const maxN = Math.max(...parsed.map(p => p.n));
    const valence = parsed.filter(p => p.n === maxN);
    return {
      count: valence.reduce((s,p) => s + p.num, 0),
      shells: valence,
    };
  }

  function formatQuantum(val) {
    if (!val.shells.length) return '—';
    const lMap = { s:0, p:1, d:2, f:3 };
    return val.shells.map(s => {
      const l = lMap[s.l];
      const mlRange = `[${-l}…${l}]`;
      return `n=${s.n}, ℓ=${l} (${s.l}), mₗ ∈ ${mlRange}`;
    }).join(' ; ');
  }

  GR.apps = GR.apps || {};
  GR.apps.periodique = {
    id:'periodique', name:'Tableau périodique', icon:'P̲e', available:true,
    mount, unmount,
  };

})(window.GR = window.GR || {});

</script>
  <script>
/**
 * apps/unites.js — Convertisseur d'unités + table des préfixes SI.
 *
 * Trois zones :
 *   - Catégories à gauche (Longueur, Masse, …)
 *   - Ligne « valeur + unité source → unité cible + résultat » en haut
 *   - Liste des unités de la catégorie en grille (un clic = sélectionne)
 *   - Sous : table de tous les préfixes SI (référence)
 *
 * On délègue toute la conversion à math.js via GR.engine.convertUnit().
 */
(function (GR) {
  'use strict';

  let activeCat = 'longueur';
  let unitFrom  = 'm';
  let unitTo    = 'cm';
  let value     = '1';
  let elValue, elResult, elFromName, elToName, elCatList, elUnitList;

  function mount(container) {
    container.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'app-header';
    head.innerHTML = `
      <span class="app-title">Unités</span>
      <span class="app-subtitle">conversion + analyse dimensionnelle gratuite via Calculs</span>
    `;
    container.appendChild(head);

    const root = document.createElement('div');
    root.className = 'units';
    container.appendChild(root);

    // ---- colonne gauche : catégories
    elCatList = document.createElement('div');
    elCatList.className = 'units-cats';
    GR.data.units.categories.forEach(cat => {
      const b = document.createElement('div');
      b.className = 'units-cat' + (cat.id === activeCat ? ' active' : '');
      b.textContent = cat.nm;
      b.dataset.id = cat.id;
      b.addEventListener('click', () => {
        activeCat = cat.id;
        // Réinitialise les unités sur la 1re et 2e de la catégorie.
        const cat0 = GR.data.units.categories.find(c => c.id === activeCat);
        unitFrom = cat0.units[0].sym;
        unitTo   = (cat0.units[1] || cat0.units[0]).sym;
        renderAll();
      });
      elCatList.appendChild(b);
    });
    root.appendChild(elCatList);

    // ---- colonne droite : panneau de conversion
    const panel = document.createElement('div');
    panel.className = 'units-panel';
    panel.innerHTML = `
      <div class="units-input">
        <input class="value-in" id="u-val" value="${value}" autocomplete="off">
        <div>
          <div class="field" id="u-from" style="display:flex;align-items:center;justify-content:center;cursor:default">m</div>
          <div id="u-from-nm" style="font-size:11px;color:var(--ink-3);text-align:center;margin-top:2px">mètre</div>
        </div>
        <div class="arrow">→</div>
        <div>
          <div class="field" id="u-to" style="display:flex;align-items:center;justify-content:center;cursor:default">cm</div>
          <div id="u-to-nm" style="font-size:11px;color:var(--ink-3);text-align:center;margin-top:2px">centimètre</div>
        </div>
      </div>
      <div class="units-input" style="margin-top:var(--s-2);grid-template-columns:1fr">
        <div class="result" id="u-result">—</div>
      </div>

      <h3 style="margin:var(--s-5) 0 var(--s-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)">
        Unités disponibles
      </h3>
      <p style="font-size:12px;color:var(--ink-3);margin:0 0 var(--s-2)">
        Clic gauche : choisir l'unité <strong>source</strong>. Maj+clic ou clic droit : unité <strong>cible</strong>.
      </p>
      <div class="units-list" id="u-list"></div>

      <h3 style="margin:var(--s-5) 0 var(--s-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)">
        Préfixes SI
      </h3>
      <p style="font-size:12px;color:var(--ink-3);margin:0 0 var(--s-2)">
        Référence complète. À combiner avec n'importe quelle unité de base : MHz, μC, GPa, nF…
      </p>
      <div class="units-prefix-table">
        <div class="units-prefix-row head">
          <div>Préfixe</div><div>Symbole</div><div>Facteur</div><div>Exemple</div>
        </div>
        ${GR.data.units.prefixes.map(([s, nm, f]) => `
          <div class="units-prefix-row">
            <div>${nm}</div>
            <div>${s || '—'}</div>
            <div>${formatFactor(f)}</div>
            <div>${exampleFor(s)}</div>
          </div>
        `).join('')}
      </div>
    `;
    root.appendChild(panel);

    elValue    = panel.querySelector('#u-val');
    elResult   = panel.querySelector('#u-result');
    elFromName = panel.querySelector('#u-from-nm');
    elToName   = panel.querySelector('#u-to-nm');
    elUnitList = panel.querySelector('#u-list');
    elValue.addEventListener('input', recompute);

    renderAll();
  }

  function unmount() {}

  function renderAll() {
    // Met à jour la liste des catégories (active class)
    elCatList.querySelectorAll('.units-cat').forEach(c => {
      c.classList.toggle('active', c.dataset.id === activeCat);
    });
    // Met à jour les libellés et la liste d'unités
    document.querySelector('#u-from').textContent = unitFrom;
    document.querySelector('#u-to').textContent   = unitTo;
    const cat = GR.data.units.categories.find(c => c.id === activeCat);
    elFromName.textContent = cat.units.find(u => u.sym === unitFrom)?.nm ?? '';
    elToName.textContent   = cat.units.find(u => u.sym === unitTo)?.nm ?? '';

    elUnitList.innerHTML = '';
    cat.units.forEach(u => {
      const it = document.createElement('div');
      it.className = 'uitem' + (u.sym === unitFrom ? ' active' : '');
      it.innerHTML = `<span>${u.sym}</span><span class="unit-name">${u.nm}</span>`;
      it.addEventListener('click', (ev) => {
        if (ev.shiftKey) unitTo = u.sym; else unitFrom = u.sym;
        renderAll();
      });
      it.addEventListener('contextmenu', (ev) => {
        ev.preventDefault();
        unitTo = u.sym; renderAll();
      });
      elUnitList.appendChild(it);
    });
    recompute();
  }

  function recompute() {
    value = elValue.value;
    const r = GR.engine.convertUnit(value, unitFrom, unitTo);
    if (!r.ok) {
      elResult.textContent = '⚠ ' + r.error;
      elResult.style.color = 'var(--bad)';
    } else {
      elResult.textContent = r.text;
      elResult.style.color = '';
    }
  }

  function formatFactor(f) {
    if (f === 1) return '1';
    const exp = Math.round(Math.log10(f));
    return `10${supExp(exp)}`;
  }
  function supExp(n) {
    const sup = { '-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹' };
    return String(n).split('').map(c => sup[c] ?? c).join('');
  }
  function exampleFor(prefix) {
    const map = { Y:'YJ', Z:'Zm', E:'EW', P:'PB', T:'THz', G:'GHz', M:'MΩ',
      k:'kg', h:'hPa', da:'daL', d:'dL', c:'cm', m:'mm', μ:'μF', n:'nm',
      p:'ps', f:'fs', a:'aJ', z:'zg', y:'yg' };
    return map[prefix] || '';
  }

  GR.apps = GR.apps || {};
  GR.apps.unites = {
    id:'unites', name:'Unités', icon:'⇌', available:true,
    mount, unmount,
  };

})(window.GR = window.GR || {});

</script>
  <script>
/**
 * apps/constantes.js — Navigateur de constantes physiques.
 *
 * Affiche les constantes du catalogue avec recherche live et filtres
 * par catégorie. Un click sur une constante :
 *   - L'insère dans le presse-papier (et l'affiche en notif éphémère).
 *   - (En option future : envoi vers Calculs en activant l'app.)
 */
(function (GR) {
  'use strict';

  let activeCat = null;
  let query = '';
  let elList, elSearch;

  function mount(container) {
    container.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'app-header';
    head.innerHTML = `
      <span class="app-title">Constantes</span>
      <span class="app-subtitle">CODATA + SI 2019 — utilisables directement dans Calculs</span>
    `;
    container.appendChild(head);

    const root = document.createElement('div');
    root.className = 'constants';
    container.appendChild(root);

    const search = document.createElement('div');
    search.className = 'constants-search';
    search.innerHTML = `
      <input id="c-search" placeholder="Rechercher (Planck, Avogadro, gravité, μ₀…)">
      <div class="seg" id="c-seg">
        <button data-c="" class="active">TOUTES</button>
        ${GR.data.constants.categories.map(([id, nm]) =>
          `<button data-c="${id}">${nm}</button>`).join('')}

    search.querySelector('#c-seg').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-c]'); if (!b) return;
      activeCat = b.dataset.c || null;
      search.querySelectorAll('#c-seg button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render();
    });

    render();

  function unmount() {}

  function match(c) {
    if (activeCat && c.cat !== activeCat) return false;
    if (!query) return true;
    return c.id.toLowerCase().includes(query)
        || c.nm.toLowerCase().includes(query)
        || c.sym.toLowerCase().includes(query);
  }

  function render() {
    elList.innerHTML = '';
    const list = GR.data.constants.list.filter(match);
    if (!list.length) {
      elList.innerHTML = '<p style="color:var(--ink-3);text-align:center;padding:var(--s-5)">Aucune constante ne correspond.</p>';
      return;

    list.forEach(c => {
      const card = document.createElement('div');

      card.innerHTML = `
        <div class="sym">${c.sym}</div>
        <div class="desc">
          <div><span class="nm">${c.nm}</span> <span class="cat">${c.cat}</span></div>
          <div style="font-size:11px;color:var(--ink-3);margin-top:2px;font-family:var(--font-mono)">id : <strong>${c.id}</strong>${c.exact ? ' · valeur exacte (SI)' : ''}</div>
          ${c.desc ? `<div style="font-size:11px;color:var(--ink-3);margin-top:2px;font-style:italic">${c.desc}</div>` : ''}
        </div>
        <div class="val">${c.value}${c.unit ? '' : ''}</div>
      `;
      card.addEventListener('click', () => {
        // Copie l'id dans le presse-papier pour usage immédiat dans Calculs.
        try { navigator.clipboard.writeText(c.id); } catch {}
        flash(card);
      });
      elList.appendChild(card);
    });
  }

  function flash(el) {
    const old = el.style.background;
    el.style.background = 'var(--mark)';
    setTimeout(() => { el.style.background = old; }, 350);
    // Notification globale courte.
    toast(`« ${el.querySelector('strong').textContent} » copié → colle-le dans Calculs.`);
  }

  function toast(msg) {
    let t = document.getElementById('grace-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'grace-toast';
      t.style.cssText = `
        position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
        background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;
        font-size:13px;z-index:100;opacity:0;transition:opacity .2s`;
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1800);
  }

  GR.apps = GR.apps || {};
  GR.apps.constantes = {
    id:'constantes', name:'Constantes', icon:'ℏ', available:true,
    mount, unmount,
  };

})(window.GR = window.GR || {});

  <script>
/**
 * apps/fonctions.js — Fonctions (table de valeurs uniquement, sans grapheur).
 *
 * On peut définir f, g, h, i (max 4 fonctions). Pour chacune, on saisit
 * l'expression en x. On choisit ensuite un intervalle [x_min, x_max] et
 * un pas, et on génère un tableau de valeurs.
 *
 * Note : le grapheur est laissé pour une étape future. La table seule
 * couvre déjà la majorité des usages "voir comment varie f".
 */
(function (GR) {
  'use strict';

  const STORAGE = 'grace.fonctions.v1';
  let funcs;
  let table = { xmin:-5, xmax:5, step:0.5 };
  let elBody;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE);
      if (raw) {
        const s = JSON.parse(raw);
        funcs = s.funcs || ['x^2','2*x+1','',''];
        table = s.table || table;
        return;
      }
    } catch {}
    funcs = ['x^2', '2*x+1', '', ''];
  }
  function save() {
    try { localStorage.setItem(STORAGE, JSON.stringify({ funcs, table })); } catch {}
  }

  function mount(container) {
    container.innerHTML = '';
    load();
    const head = document.createElement('div');
    head.className = 'app-header';
    head.innerHTML = `
      <span class="app-title">Fonctions</span>
      <span class="app-subtitle">définition + table de valeurs (sans grapheur)</span>
    `;
    container.appendChild(head);

    elBody = document.createElement('div');
    elBody.className = 'app-body';
    container.appendChild(elBody);

    render();
  }
  function unmount() {}

  function render() {
    elBody.innerHTML = `
      <div class="card" style="max-width:680px">
        <h3>Définitions</h3>
        <div style="display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center">
          ${['f','g','h','i'].map((nm,i) => `
            <label>${nm}(x) =</label>
            <input class="field" data-fi="${i}" value="${escape(funcs[i])}">
          `).join('')}
        </div>
      </div>

      <div class="card" style="max-width:680px;margin-top:var(--s-3)">
        <h3>Intervalle</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end">
          <div><div style="font-size:11px;color:var(--ink-3)">x min</div><input class="field" id="xmin" value="${table.xmin}"></div>
          <div><div style="font-size:11px;color:var(--ink-3)">x max</div><input class="field" id="xmax" value="${table.xmax}"></div>
          <div><div style="font-size:11px;color:var(--ink-3)">pas</div><input class="field" id="step" value="${table.step}"></div>
          <button class="btn primary" id="go">Calculer</button>
        </div>
      </div>

      <div id="tbl" style="margin-top:var(--s-4)"></div>
    `;
    elBody.querySelectorAll('[data-fi]').forEach(inp => {
      inp.addEventListener('input', e => { funcs[+e.target.dataset.fi] = e.target.value; save(); });
    });
    elBody.querySelector('#go').addEventListener('click', () => {
      table.xmin = parseFloat(elBody.querySelector('#xmin').value);
      table.xmax = parseFloat(elBody.querySelector('#xmax').value);
      table.step = parseFloat(elBody.querySelector('#step').value);
      save();
      renderTable();
    });
    renderTable();
  }

  function renderTable() {
    const tbl = elBody.querySelector('#tbl');
    const m = window.math;
    // Compile chaque fonction pour évaluer rapidement.
    const compiled = funcs.map(src => {
      if (!src.trim()) return null;
      try { return m.compile(src); } catch { return { error:true }; }
    });
    const xs = [];
    for (let x = table.xmin; x <= table.xmax + 1e-12; x += table.step) xs.push(round(x));
    let head = '<th>x</th>' + ['f','g','h','i'].map((nm,i) => funcs[i].trim() ? `<th>${nm}(x)</th>` : '').join('');
    let rows = xs.map(x => {
      const cells = compiled.map((c,i) => {
        if (!funcs[i].trim()) return '';
        if (!c || c.error) return '<td class="num">⚠</td>';
        try { return `<td class="num">${fmt(c.evaluate({ x }))}</td>`; }
        catch { return '<td class="num">⚠</td>'; }
      }).join('');

/**
 * apps/equations.js — Résolveur d'équations.
 *
 * Trois modes :
 *   - Linéaire / quadratique : saisie ax+b=0 ou ax²+bx+c=0 (formules fermées).

(function (GR) {

  let elBody;

  function mount(container) {

      <span class="app-title">Équations</span>
      <span class="app-subtitle">linéaires, polynomiales, systèmes</span>

    elBody.className = 'app-body';
    container.appendChild(elBody);

    head.querySelector('#eq-mode').addEventListener('click', (e) => {

  function render() {

    if (mode === 'sys') renderSys();
  }

  // ---- Linéaire ax + b = 0
  function renderLin() {
    elBody.innerHTML = `
      <p style="color:var(--ink-3);margin:0 0 var(--s-3)">Résolution de <em>ax + b = 0</em>.</p>
      <div class="card" style="display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;max-width:520px">
        <label>a =</label><input class="field" id="a" value="2">
        <label>b =</label><input class="field" id="b" value="-6">

    elBody.querySelector('#go').addEventListener('click', () => {
      const a = num('#a'), b = num('#b');
      const out = elBody.querySelector('#out');
      if (a === 0) {
        out.innerHTML = b === 0 ? card('Infinité de solutions (0 = 0).') : card('Aucune solution (b ≠ 0).');
      } else {
        const x = -b/a;
        out.innerHTML = card(`x = ${fmt(x)}`);
      }
    });
  }

  // ---- Quadratique ax² + bx + c = 0
  function renderQuad() {
    elBody.innerHTML = `
      <p style="color:var(--ink-3);margin:0 0 var(--s-3)">Résolution de <em>ax² + bx + c = 0</em> dans ℂ.</p>
      <div class="card" style="display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;max-width:520px">
        <label>a =</label><input class="field" id="a" value="1">
        <label>b =</label><input class="field" id="b" value="-3">
        <label>c =</label><input class="field" id="c" value="2">
        <div></div><button class="btn primary" id="go">Résoudre</button>

    elBody.querySelector('#go').addEventListener('click', () => {
      const a = num('#a'), b = num('#b'), c = num('#c');
      const out = elBody.querySelector('#out');
      if (a === 0) { out.innerHTML = card('a = 0 : utilise le mode Linéaire.'); return; }

        Entre les coefficients du plus haut degré au degré 0, séparés par des virgules.<br>
        Ex : <code>1, -6, 11, -6</code> pour <em>x³ − 6x² + 11x − 6</em>.
      </p>
      <div class="card" style="display:grid;gap:8px;max-width:600px">
        <input class="field" id="coefs" value="1, -6, 11, -6">

      <div id="out" style="margin-top:var(--s-4)"></div>

    elBody.querySelector('#go').addEventListener('click', () => {
      const raw = elBody.querySelector('#coefs').value.trim();
      const out = elBody.querySelector('#out');
      const coefs = raw.split(',').map(s => parseFloat(s));
      if (coefs.some(isNaN) || coefs.length < 2) {
        out.innerHTML = card('Liste de coefficients invalide.', 'bad'); return;
      }
      // math.js : polynomialRoot existe en v13.
      try {
        let roots;
        if (typeof window.math.polynomialRoot === 'function') {
          // Format math.js : coef du degré 0 au degré n.
          roots = window.math.polynomialRoot(...coefs.slice().reverse());
          if (!Array.isArray(roots)) roots = [roots];
        } else {
          // Fallback : matrice compagnon + valeurs propres.
          roots = companionRoots(coefs);

  function companionRoots(coefs) {

    const M = Array.from({length:n}, () => Array(n).fill(0));
    for (let i = 1; i < n; i++) M[i][i-1] = 1;
    for (let i = 0; i < n; i++) M[i][n-1] = -coefs[n-i] / a0;

      <div class="card" style="display:grid;grid-template-columns:80px 1fr;gap:8px;max-width:680px">
        <label>A =</label><input class="field" id="A" value="2,1,-1; -3,-1,2; -2,1,2">
        <label>B =</label><input class="field" id="B" value="8; -11; -3">
        <div></div><button class="btn primary" id="go">Résoudre</button>
      </div>
      <div id="out" style="margin-top:var(--s-4)"></div>
    `;
    elBody.querySelector('#go').addEventListener('click', () => {
      const Astr = elBody.querySelector('#A').value;
      const Bstr = elBody.querySelector('#B').value;
      const out = elBody.querySelector('#out');
      try {
        const A = parseMatrix(Astr);
        const B = parseMatrix(Bstr);
        const x = window.math.lusolve(A, B);
        const arr = x.toArray ? x.toArray() : x;
        const list = arr.map((row, i) => {
          const v = Array.isArray(row) ? row[0] : row;

        }).join('');
        out.innerHTML = `<div class="card">${list}</div>`;
      } catch (e) {
        out.innerHTML = card('Erreur : ' + e.message, 'bad');
      }
    });
  }

  function parseMatrix(s) {
    return s.split(';').map(row => row.split(',').map(v => parseFloat(v.trim())));
  }

  // ---- Helpers communs
  function num(sel) { return parseFloat(elBody.querySelector(sel).value) || 0; }
  function card(html, kind) {
    return `<div class="card" style="color:${kind==='bad'?'var(--bad)':'inherit'}">${html}</div>`;
  }
  function fmt(x) {
    if (typeof x !== 'number') return String(x);

  function fmtRoot(r) {
    if (typeof r === 'object' && r !== null && 're' in r) {

    }

  GR.apps.equations = {
    id:'equations', name:'Équations', icon:'=', available:true,
    mount, unmount,
  };

})(window.GR = window.GR || {});

  function stats1(arr) {

/**
 * apps/regressions.js — Ajustements de modèles à des données (x, y).
 *

 *   - linéaire        : y = a x + b
 *   - affine pondéré  : y = a x + b (idem ; gardé en alias)
 *   - polynomiale     : y = sum a_k x^k (degré au choix)

    ['exp',  'Exponentielle (y = a · e^{b x})'],

  GR.apps.regressions = {

 *   - Une cellule contient soit une valeur (parsée comme nombre),

 *   - Recalcul à chaque édition (l'ensemble du tableau, simple et suffisant

  function load() {

      <span class="app-subtitle">A1:${COL_NAMES[COLS-1]}${ROWS} — formules « =A1+B2 », « =SUM(A1:A10) »</span>

      const a = c1.charCodeAt(0), b = c2.charCodeAt(0);
      const list = [];
      for (let cc = Math.min(a,b); cc <= Math.max(a,b); cc++) {
        for (let rr = Math.min(+r1, +r2); rr <= Math.max(+r1, +r2); rr++) {
          list.push(String.fromCharCode(cc) + rr);
        }
      }
      return '[' + list.join(',') + ']';
    });
    // Remplace références A1 par leur valeur numérique (0 si vide / non num).
    expr = expr.replace(/\b([A-Z])(\d+)\b/g, (_, c, r) => {
      const v = getVal(c + r);
      if (!v || v.error || typeof v.value !== 'number') return '0';
      return '(' + v.value + ')';
    });
    // Alias français/maj
    expr = expr.replace(/\bSUM\b/g, 'sum')
               .replace(/\bAVG\b/g, 'mean')
               .replace(/\bAVERAGE\b/g, 'mean')
               .replace(/\bMIN\b/g, 'min')
               .replace(/\bMAX\b/g, 'max')
               .replace(/\bCOUNT\b/g, 'length');
    return expr;
  }

  function fmt(x) {
    if (typeof x !== 'number') return String(x);
    if (Number.isInteger(x)) return String(x);
    return parseFloat(x.toPrecision(8)).toString();
  }

  GR.apps = GR.apps || {};
  GR.apps.tableur = {
    id:'tableur', name:'Tableur', icon:'⊞', available:true,
    mount, unmount,
  };

})(window.GR = window.GR || {});

</script>

/**

 *
 * - Thème clair / sombre (synchronisé avec le bouton de la sidebar)
 * - Mode angulaire par défaut
 * - Précision d'affichage
 * - Réinitialiser : variables, historique, ou tout l'état
 * - Infos sur l'app
 */
(function (GR) {
  'use strict';

  function mount(container) {
    container.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'app-header';
    head.innerHTML = `
      <span class="app-title">Réglages</span>
      <span class="app-subtitle">préférences locales (stockées dans ton navigateur)</span>
    `;
    container.appendChild(head);

    const body = document.createElement('div');
    body.className = 'settings';
    body.innerHTML = `
      <div class="group">
        <h3>Apparence</h3>
        <div class="row">
          <div>
            <div class="lbl">Thème</div>
            <div class="hlp">Bascule aussi avec <kbd>Ctrl</kbd>+<kbd>T</kbd>.</div>
          </div>
          <div class="seg" id="seg-theme">
            <button data-v="light">Clair</button>
            <button data-v="dark">Sombre</button>
          </div>
        </div>
      </div>

      <div class="group">
        <h3>Calculs</h3>
        <div class="row">
          <div>
            <div class="lbl">Mode angulaire par défaut</div>
            <div class="hlp">Modifiable à la volée dans l'app Calculs.</div>
          </div>
          <div class="seg" id="seg-angle">
            <button data-v="rad">RAD</button>
            <button data-v="deg">DEG</button>
          </div>
        </div>
      </div>

      <div class="group">
        <h3>Données</h3>
        <div class="row">
          <div>
            <div class="lbl">Effacer l'historique</div>
            <div class="hlp">Supprime tous les calculs précédents.</div>
          </div>
          <button class="btn danger" id="btn-clear-hist">Effacer</button>
        </div>
        <div class="row">
          <div>
            <div class="lbl">Effacer les variables A..Z</div>
            <div class="hlp">N'affecte ni constantes ni mode.</div>
          </div>
          <button class="btn danger" id="btn-clear-vars">Effacer</button>
        </div>
        <div class="row">
          <div>
            <div class="lbl">Réinitialiser tout l'état</div>
            <div class="hlp">Tout (thème, variables, historique). Recharge la page après.</div>
          </div>
          <button class="btn danger" id="btn-reset">Réinitialiser</button>
        </div>
      </div>

      <div class="group">
        <h3>À propos</h3>
        <div style="padding:var(--s-3);font-size:13px;color:var(--ink-2);line-height:1.6">
          <p style="margin:0 0 var(--s-2)"><strong>Grace</strong> — recréation libre d'une NumWorks adaptée desktop.</p>
          <p style="margin:0 0 var(--s-2)">Bibliothèques : <code>math.js</code> (calcul), <code>KaTeX</code> (rendu LaTeX).</p>
          <p style="margin:0;font-size:11px;color:var(--ink-3)">Tout fonctionne hors-ligne après le premier chargement (les CDN sont mis en cache par le navigateur).</p>
        </div>
      </div>
    `;
    container.appendChild(body);

    // Branchements
    const segTheme = body.querySelector('#seg-theme');
    segTheme.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.v === GR.state.get().theme);
      b.addEventListener('click', () => {
        document.body.dataset.theme = b.dataset.v;
        GR.state.set({ theme: b.dataset.v });
        segTheme.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      });
    });
    const segAngle = body.querySelector('#seg-angle');
    segAngle.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.v === GR.engine.getAngleMode());
      b.addEventListener('click', () => {
        GR.engine.setAngleMode(b.dataset.v);
        GR.state.set({ angleMode: b.dataset.v });
        segAngle.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      });
    });
    body.querySelector('#btn-clear-hist').addEventListener('click', () => {
      if (confirm('Effacer tout l\'historique ?')) GR.state.clearHistory();
    });
    body.querySelector('#btn-clear-vars').addEventListener('click', () => {
      if (confirm('Effacer toutes les variables utilisateur ?')) GR.engine.clearVars();
    });
    body.querySelector('#btn-reset').addEventListener('click', () => {
      if (confirm('Tout réinitialiser ? Cette action recharge la page.')) {
        try { localStorage.removeItem('grace.state.v1'); } catch {}
        location.reload();
      }
    });
  }

  function unmount() {}

  GR.apps = GR.apps || {};
  GR.apps.reglages = {
    id:'reglages', name:'Réglages', icon:'⚙', available:true,
    mount, unmount,
  };

})(window.GR = window.GR || {});

</script>
  <script>
/**
 * main.js — Bootstrap de l'application.
 *
 * - Liste statique des apps (sans Python ni Géométrie : retirées sur
 *   décision projet).
 * - Routeur : mount/unmount.
 * - Branchement boutons globaux + raccourcis.
 */
(function (GR) {
  'use strict';

  // 12 apps, ordre type NumWorks adapté.
  const APP_REGISTRY = [
    { id:'calculs',     name:'Calculs',          icon:'∑',  shortcut:'Ctrl+1' },
    { id:'fonctions',   name:'Fonctions',        icon:'ƒ',  shortcut:'Ctrl+2' },
    { id:'equations',   name:'Équations',        icon:'=',  shortcut:'Ctrl+3' },
    { id:'statistiques',name:'Statistiques',     icon:'σ',  shortcut:'Ctrl+4' },
    { id:'probabilites',name:'Probabilités',     icon:'P',  shortcut:'Ctrl+5' },
    { id:'regressions', name:'Régressions',      icon:'⤢',  shortcut:'Ctrl+6' },
    { id:'suites',      name:'Suites',           icon:'uₙ', shortcut:'Ctrl+7' },
    { id:'tableur',     name:'Tableur',          icon:'⊞',  shortcut:'Ctrl+8' },
    { id:'unites',      name:'Unités',           icon:'⇌',  shortcut:'Ctrl+9' },
    { id:'constantes',  name:'Constantes',       icon:'ℏ' },
    { id:'periodique',  name:'Tableau périodique', icon:'P̲e' },
    { id:'reglages',    name:'Réglages',         icon:'⚙' },
  ];

  let currentApp = null;
  let elMain, elSidebarList, elVkb, elVkbToggle, elThemeToggle;

  function start() {
    elMain        = document.getElementById('main');
    elSidebarList = document.getElementById('app-list');
    elVkb         = document.getElementById('vkb');
    elVkbToggle   = document.getElementById('vkb-toggle');
    elThemeToggle = document.getElementById('theme-toggle');

    const s = GR.state.get();
    document.body.dataset.theme = s.theme;
    if (GR.engine && s.angleMode) GR.engine.setAngleMode(s.angleMode);

    buildSidebar();
    bindGlobalControls();
    registerShortcuts();
    GR.keyboard.init();

    const initial = GR.apps[s.currentApp] ? s.currentApp : 'calculs';
    activate(initial);
    setVkb(s.vkbOpen);
  }

  function buildSidebar() {
    elSidebarList.innerHTML = '';
    APP_REGISTRY.forEach(meta => {
      const impl = GR.apps[meta.id];
      const btn = document.createElement('button');
      btn.className = 'app-link';
      btn.dataset.app = meta.id;
      btn.innerHTML = `
        <span class="icon">${meta.icon}</span>
        <span class="label">${meta.name}</span>
        ${meta.shortcut ? `<span class="shortcut">${meta.shortcut.replace('Ctrl+','⌃')}</span>` : ''}
      `;
      if (!impl || !impl.available) {
        btn.classList.add('disabled');
        btn.title = 'Bientôt disponible';
      }
      btn.addEventListener('click', () => activate(meta.id));
      elSidebarList.appendChild(btn);
    });
  }

  function activate(appId) {
    const impl = GR.apps[appId];
    if (currentApp && currentApp.unmount) { try { currentApp.unmount(); } catch {} }
    currentApp = null;

    elSidebarList.querySelectorAll('.app-link').forEach(b =>
      b.classList.toggle('active', b.dataset.app === appId));

    if (!impl || !impl.available) {
      renderComingSoon(appId);
      GR.state.set({ currentApp: appId });
      return;
    }

    impl.mount(elMain);
    currentApp = impl;
    GR.state.set({ currentApp: appId });

    if (impl.renderVKB) impl.renderVKB(elVkb);
    else elVkb.innerHTML = '<p style="color:var(--ink-4);padding:var(--s-4);text-align:center">Pas de clavier virtuel pour cette app.</p>';
  }

  function renderComingSoon(appId) {
    const meta = APP_REGISTRY.find(a => a.id === appId) || { name: appId };
    elMain.innerHTML = `
      <div class="app-header"><span class="app-title">${meta.name}</span></div>
      <div class="coming-soon">
        <h2>Bientôt</h2>
        <p>Cette application n'est pas encore implémentée.</p>
        <p style="margin-top:12px;font-size:12px">
          Retour à <strong>Calculs</strong> avec <kbd>Ctrl</kbd>+<kbd>1</kbd> ou <kbd>Échap</kbd>.
        </p>
      </div>
    `;
  }

  function bindGlobalControls() {
    elThemeToggle.addEventListener('click', toggleTheme);
    elVkbToggle.addEventListener('click', () => setVkb(!GR.state.get().vkbOpen));
  }

  function toggleTheme() {
    const cur = GR.state.get().theme;
    const next = cur === 'light' ? 'dark' : 'light';
    document.body.dataset.theme = next;
    GR.state.set({ theme: next });
  }

  function setVkb(open) {
    elVkb.hidden = !open;
    elVkbToggle.classList.toggle('active', open);
    GR.state.set({ vkbOpen: open });
    if (open && currentApp && currentApp.renderVKB) currentApp.renderVKB(elVkb);
  }

  function registerShortcuts() {
    APP_REGISTRY.forEach(meta => {
      if (!meta.shortcut) return;
      GR.keyboard.register(meta.shortcut, meta.name, () => activate(meta.id));
    });
    GR.keyboard.register('Esc',    'Retour Calculs',  () => activate('calculs'));
    GR.keyboard.register('Ctrl+T', 'Thème',           toggleTheme);
    GR.keyboard.register('Ctrl+K', 'Clavier virtuel', () => setVkb(!GR.state.get().vkbOpen));
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();

})(window.GR = window.GR || {});

</script>
</body>
